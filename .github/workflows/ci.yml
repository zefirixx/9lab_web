name: PHP Docker CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Start Docker
        run: docker compose up -d --build

      - name: Install dependencies
        run: docker compose exec -T php composer install

      - name: Start PHP server
        run: docker compose exec -T php php -S 0.0.0.0:8080 -t /var/www/html &

      - name: Run tests
        run: docker compose exec -T php vendor/bin/phpunit tests

      - name: Stop containers
        if: always()
        run: docker compose down
